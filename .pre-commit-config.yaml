repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      # test_keys.py contains NO real keys — only assertion tests for the keys.py loader
      # (tests that missing env vars raise MissingSigningKeysError). The hook regex
      # matches on variable names like `axiom_ed25519_private_pem`. Scoped exclude only.
      - id: detect-private-key
        exclude: ^apps/backend/tests/receipt/test_keys\.py$
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^apps/backend/
      - id: ruff-format
        files: ^apps/backend/

  # mypy runs against the project's own locked environment via uv, not an
  # isolated additional_dependencies list. That list could never keep up with
  # the real dependency set (pgvector, fastembed, mcp, orjson, uuid6, ...), so
  # it reported import-not-found and contradicted the authoritative backend CI
  # run, which passes cleanly.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project env via uv)
        entry: bash -c 'cd apps/backend && uv run mypy src'
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-print-statements
        name: Block print() in source code
        entry: bash -c 'if grep -rnE "^[^#]*\\bprint\\(" apps/backend/src/axiom/ --exclude-dir=__pycache__ --exclude=compliance.py; then echo "print() found - use structlog logger"; exit 1; fi'
        language: system
        pass_filenames: false
