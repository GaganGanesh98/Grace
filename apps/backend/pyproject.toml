[project]
name = "grace-backend"
version = "0.1.0"
description = "Cryptographic governance proof layer for AI agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5",
    "authlib>=1.4.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
    "greenlet>=3.1.0",
    "structlog>=26.1.0",
    "orjson>=3.10.0",
    "slowapi>=0.1.9",
    "rfc8785>=0.1.4",
    "dilithium-py>=1.4.0",
    "pqcrypto>=0.4.0",
    "pyyaml>=6.0.0",
    "uuid6>=2024.7.24",
    "fastembed>=0.8.0",
    "pgvector>=0.5.0",
    "mcp>=2.0.0",
]

[project.scripts]
# stdio transport for the MCP governance server (Phase 7.0).
# Requires AXIOM_API_KEY with the 'mcp:read' / 'mcp:write' scopes.
axiom-mcp = "axiom.mcp.transport:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "mypy>=1.13.0",
    "types-passlib",
    "types-python-jose",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
    "detect-secrets>=1.5.0",
    "import-linter>=2.11",
    "pytest-httpx>=0.36.2",
    "hypothesis>=6.100.0",
    "asn1crypto>=1.5.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "ARG",
    "PTH",
    "ERA",
    "PL",
    "RUF",
    "S",
    "BLE",
    "FBT",
    "DTZ",
]
ignore = [
    "PLR0913",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLW0603",
    "PLC0415",
    "ARG001",
    "UP043",
    "UP046",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"tests/conftest.py" = ["E402", "PLR0402"]
"src/axiom/main.py" = ["BLE001"]
# runner.py catches Exception and logs with exc_info=True; ruff's BLE001
# heuristic doesn't fire, but our `test_no_silent_errors` security gate
# still demands a visible noqa marker. Silence RUF100 only for that file.
"src/axiom/services/pipeline/runner.py" = ["RUF100"]
"src/axiom/services/pipeline/preflight_runner.py" = ["RUF100"]
# Crypto primitives are byte-locked post Phase 1.75. Phase 2 must not
# modify their contents (including import-group whitespace). Silence
# Ruff's I001 (import sort) on these files so a future cosmetic drift
# doesn't force a touch.
"src/axiom/services/crypto/aes_gcm.py" = ["I001"]
"src/axiom/services/crypto/ed25519.py" = ["I001"]
"src/axiom/services/crypto/hybrid.py" = ["I001"]
"src/axiom/services/crypto/vault.py" = ["I001"]
"src/axiom/schemas/auth.py" = ["S105"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "dilithium_py.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asn1crypto.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q --strict-markers --cov=axiom --cov-branch --cov-report=term-missing --cov-fail-under=80"
markers = [
    "security: security-focused tests",
    "slow: tests that take > 1s",
]

[tool.coverage.run]
source = ["src/axiom"]
omit = [
    "tests/*",
    "alembic/*",
    "*/migrations/*",
]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
]
fail_under = 80

[tool.coverage.paths]
source = ["src/axiom", "*/axiom"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]
